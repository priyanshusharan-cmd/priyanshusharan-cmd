<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="Celestia: Orbital dynamics lab. Interactive three-body simulator with click-to-place bodies, full playback and a headless test suite.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1228"/><stop offset="1" stop-color="#060A18"/>
    </linearGradient>
    <radialGradient id="h" cx="0.92" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.22"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset="0.5" stop-color="#5EEAD4"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="580" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .dot { animation: d 1.8s ease-in-out infinite; }
    @keyframes d { 50% { opacity:.25 } }
    .edge { animation: e 5s ease-in-out infinite; }
    @keyframes e { 0%,100% { transform:translateX(-580px) } 50% { transform:translateX(580px) } }
    .o1 { animation: sp 6s linear infinite; } .o2 { animation: sp 10s linear infinite reverse; } @keyframes sp { to { transform: rotate(360deg) } }
  </style>
  <g clip-path="url(#c)">
    <rect width="580" height="300" fill="url(#g)"/>
    <rect width="580" height="300" fill="url(#h)"/>
    
    <g transform="translate(470 150)">
      <ellipse rx="70" ry="26" fill="none" stroke="#5EEAD4" stroke-opacity="0.35" transform="rotate(-20)"/>
      <ellipse rx="46" ry="62" fill="none" stroke="#5EEAD4" stroke-opacity="0.2" transform="rotate(30)"/>
      <circle r="10" fill="#F5B841" filter="url(#gl)"/>
      <g transform="rotate(-20)"><circle r="4.5" fill="#5EEAD4" filter="url(#gl)"><animateMotion dur="6s" repeatCount="indefinite" path="M70 0 A70 26 0 1 1 -70 0 A70 26 0 1 1 70 0"/></circle></g>
      <g transform="rotate(30)"><circle r="3" fill="#EAF0FF"><animateMotion dur="10s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" path="M46 0 A46 62 0 1 1 -46 0 A46 62 0 1 1 46 0"/></circle></g>
    </g>

    <rect class="edge" x="0" y="0" width="580" height="2" fill="url(#edge)"/>
    <text x="32" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#5EEAD4" letter-spacing="2">ORBITAL DYNAMICS LAB</text>
    <text x="30" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#EAF0FF" letter-spacing="-0.5">Celestia</text>
    <text x="32" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">Interactive three-body simulator with</text><text x="32" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">click-to-place bodies, full playback</text><text x="32" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">and a headless test suite.</text>
    <rect x="32.0" y="238" width="69.4" height="26" rx="13" fill="#5EEAD4" fill-opacity="0.09" stroke="#5EEAD4" stroke-opacity="0.35"/><text x="66.7" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#5EEAD4">Python</text><rect x="109.4" y="238" width="93.1" height="26" rx="13" fill="#5EEAD4" fill-opacity="0.09" stroke="#5EEAD4" stroke-opacity="0.35"/><text x="156.0" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#5EEAD4">Streamlit</text><rect x="210.5" y="238" width="77.3" height="26" rx="13" fill="#5EEAD4" fill-opacity="0.09" stroke="#5EEAD4" stroke-opacity="0.35"/><text x="249.2" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#5EEAD4">REBOUND</text><rect x="295.8" y="238" width="61.5" height="26" rx="13" fill="#5EEAD4" fill-opacity="0.09" stroke="#5EEAD4" stroke-opacity="0.35"/><text x="326.6" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#5EEAD4">Manim</text><rect x="365.3" y="238" width="69.4" height="26" rx="13" fill="#5EEAD4" fill-opacity="0.09" stroke="#5EEAD4" stroke-opacity="0.35"/><text x="400.0" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#5EEAD4">Docker</text>
    <g transform="translate(481.2 32)">
      <rect width="66.8" height="28" rx="14" fill="#060A18" stroke="#5EEAD4" stroke-opacity="0.5"/>
      <circle class="dot" cx="16" cy="14" r="4" fill="#5EEAD4"/>
      <text x="28" y="19" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#5EEAD4" letter-spacing="1.5">LIVE</text>
    </g>
    <rect x="0.5" y="0.5" width="579" height="299" rx="18" fill="none" stroke="#1B2650"/>
  </g>
</svg>
