<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="CampusIQ: Academic tracker. GPA, SGPA and CGPA tracking, attendance prediction, timetables and a goal calculator for next semester.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1228"/><stop offset="1" stop-color="#060A18"/>
    </linearGradient>
    <radialGradient id="h" cx="0.92" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.22"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="580" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .dot { animation: d 1.8s ease-in-out infinite; }
    @keyframes d { 50% { opacity:.25 } }
    .edge { animation: e 5s ease-in-out infinite; }
    @keyframes e { 0%,100% { transform:translateX(-580px) } 50% { transform:translateX(580px) } }
    .ring { animation: rg 4s ease-in-out infinite; } @keyframes rg { 0% { stroke-dashoffset:276.5 } 60%,85% { stroke-dashoffset:22.1 } 100% { stroke-dashoffset:276.5 } }
  </style>
  <g clip-path="url(#c)">
    <rect width="580" height="300" fill="url(#g)"/>
    <rect width="580" height="300" fill="url(#h)"/>
    
    <g transform="translate(470 150)">
      <circle r="44" fill="none" stroke="#F472B6" stroke-opacity="0.15" stroke-width="9"/>
      <circle class="ring" r="44" fill="none" stroke="#F472B6" stroke-width="9" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="276.5" filter="url(#gl)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#EAF0FF">GPA</text>
      <text y="24" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="9" fill="#8A97C2" letter-spacing="1">TRACKED</text>
    </g>

    <rect class="edge" x="0" y="0" width="580" height="2" fill="url(#edge)"/>
    <text x="32" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F472B6" letter-spacing="2">ACADEMIC TRACKER</text>
    <text x="30" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#EAF0FF" letter-spacing="-0.5">CampusIQ</text>
    <text x="32" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">GPA, SGPA and CGPA tracking, attendance</text><text x="32" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">prediction, timetables and a goal</text><text x="32" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">calculator for next semester.</text>
    <rect x="32.0" y="238" width="116.8" height="26" rx="13" fill="#F472B6" fill-opacity="0.09" stroke="#F472B6" stroke-opacity="0.35"/><text x="90.4" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F472B6">React Native</text><rect x="156.8" y="238" width="53.6" height="26" rx="13" fill="#F472B6" fill-opacity="0.09" stroke="#F472B6" stroke-opacity="0.35"/><text x="183.6" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F472B6">Expo</text><rect x="218.4" y="238" width="101.0" height="26" rx="13" fill="#F472B6" fill-opacity="0.09" stroke="#F472B6" stroke-opacity="0.35"/><text x="268.9" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F472B6">TypeScript</text><rect x="327.4" y="238" width="77.3" height="26" rx="13" fill="#F472B6" fill-opacity="0.09" stroke="#F472B6" stroke-opacity="0.35"/><text x="366.0" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F472B6">Zustand</text>
    <g transform="translate(464.8 32)">
      <rect width="83.2" height="28" rx="14" fill="#060A18" stroke="#F472B6" stroke-opacity="0.5"/>
      <circle class="dot" cx="16" cy="14" r="4" fill="#F472B6"/>
      <text x="28" y="19" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F472B6" letter-spacing="1.5">MOBILE</text>
    </g>
    <rect x="0.5" y="0.5" width="579" height="299" rx="18" fill="none" stroke="#1B2650"/>
  </g>
</svg>
