<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="Ridify: Campus ride-sharing. Student carpooling gated by verified college email, real-time over Socket.IO, with physics-tuned Flutter motion.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1228"/><stop offset="1" stop-color="#060A18"/>
    </linearGradient>
    <radialGradient id="h" cx="0.92" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#F5B841" stop-opacity="0.22"/><stop offset="1" stop-color="#F5B841" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B841" stop-opacity="0"/><stop offset="0.5" stop-color="#F5B841"/><stop offset="1" stop-color="#F5B841" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="580" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .dot { animation: d 1.8s ease-in-out infinite; }
    @keyframes d { 50% { opacity:.25 } }
    .edge { animation: e 5s ease-in-out infinite; }
    @keyframes e { 0%,100% { transform:translateX(-580px) } 50% { transform:translateX(580px) } }
    
  </style>
  <g clip-path="url(#c)">
    <rect width="580" height="300" fill="url(#g)"/>
    <rect width="580" height="300" fill="url(#h)"/>
    
    <g transform="translate(408 112) scale(0.78)">
      <path d="M0 70 C 50 70, 70 10, 130 10 S 190 50, 200 50" fill="none" stroke="#F5B841" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round" id="road"/>
      <path d="M0 70 C 50 70, 70 10, 130 10 S 190 50, 200 50" fill="none" stroke="#F5B841" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 8"/>
      <circle cx="0" cy="70" r="5" fill="#5EEAD4"/><circle cx="200" cy="50" r="5" fill="#F472B6"/>
      <g filter="url(#gl)">
        <rect x="-9" y="-5" width="18" height="10" rx="4" fill="#F5B841">
          <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="spline" keySplines="0.45 0 0.25 1;0 0 1 1" path="M0 70 C 50 70, 70 10, 130 10 S 190 50, 200 50"/>
        </rect>
      </g>
    </g>

    <rect class="edge" x="0" y="0" width="580" height="2" fill="url(#edge)"/>
    <text x="32" y="52" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F5B841" letter-spacing="2">CAMPUS RIDE-SHARING</text>
    <text x="30" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#EAF0FF" letter-spacing="-0.5">Ridify</text>
    <text x="32" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">Student carpooling gated by verified</text><text x="32" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">college email, real-time over Socket.IO,</text><text x="32" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="16" fill="#8A97C2">with physics-tuned Flutter motion.</text>
    <rect x="32.0" y="238" width="77.3" height="26" rx="13" fill="#F5B841" fill-opacity="0.09" stroke="#F5B841" stroke-opacity="0.35"/><text x="70.7" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F5B841">Flutter</text><rect x="117.3" y="238" width="77.3" height="26" rx="13" fill="#F5B841" fill-opacity="0.09" stroke="#F5B841" stroke-opacity="0.35"/><text x="156.0" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F5B841">Node.js</text><rect x="202.6" y="238" width="77.3" height="26" rx="13" fill="#F5B841" fill-opacity="0.09" stroke="#F5B841" stroke-opacity="0.35"/><text x="241.3" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F5B841">MongoDB</text><rect x="287.9" y="238" width="93.1" height="26" rx="13" fill="#F5B841" fill-opacity="0.09" stroke="#F5B841" stroke-opacity="0.35"/><text x="334.5" y="255.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" fill="#F5B841">Socket.IO</text>
    <g transform="translate(481.2 32)">
      <rect width="66.8" height="28" rx="14" fill="#060A18" stroke="#F5B841" stroke-opacity="0.5"/>
      <circle class="dot" cx="16" cy="14" r="4" fill="#F5B841"/>
      <text x="28" y="19" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#F5B841" letter-spacing="1.5">LIVE</text>
    </g>
    <rect x="0.5" y="0.5" width="579" height="299" rx="18" fill="none" stroke="#1B2650"/>
  </g>
</svg>
